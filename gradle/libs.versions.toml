[versions]
agp = "8.13.2"
javascriptengine = "1.1.0"
kotlin = "2.3.21"
coreKtx = "1.16.0"
kotlinxCoroutinesGuava = "1.11.0"
kotlinxSerializationJson = "1.11.0"
kotlinxSerializationProtobuf = "1.11.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.9.3"
okhttp = "5.3.2"
webkit = "1.16.0"
journeyZXingEmbedded = "4.3.0"
googleZXingCore = "3.5.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-javascriptengine = { module = "androidx.javascriptengine:javascriptengine", version.ref = "javascriptengine" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "kotlinxCoroutinesGuava" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinxSerializationProtobuf" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
journey-zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "journeyZXingEmbedded" }
google-zxing-core = { module = "com.google.zxing:core", version.ref = "googleZXingCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

