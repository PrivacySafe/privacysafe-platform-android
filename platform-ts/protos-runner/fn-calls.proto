syntax = "proto2";

package fn_calls;

message RequestWithinCallIntoJS {
	required int32 id = 1;
	required string fn_name = 2;
	required bytes args = 3;
}

message RequestWithinCallIntoAndroid {
	required int32 id = 1;
	required bytes args = 2;
}

message ReplyWithinCall {
	required int32 id = 1;
	required bytes res = 2;
	optional string err = 3;
}

message BooleanValue {
	required bool value = 1;
}

message IntValue {
	required int32 value = 1;
}

message StringArrayValue {
	repeated string values = 1;
}

message StringValue {
	required string value = 1;
}

message NamedData {
	required string port_name = 1;
	required bytes data = 2;
}
