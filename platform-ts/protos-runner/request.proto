syntax = "proto2";

package request_op;

message Header {
	required string name = 1;
	required string value = 2;
}

message RequestOpts {
	required string method = 1;
	required string url = 2;
	optional string response_type = 3;
	optional string session_id = 4;
	repeated Header request_headers = 5;
	repeated string response_headers = 6;
	optional int32 timeout = 7;
	optional int32 timeout_retries = 8;
	optional string content_type = 9;
	required bytes body = 10;
}

message RequestArgs {
	required string net_id = 1;
	required RequestOpts opts = 2;
}

message Reply {
	required int32 status = 1;
	repeated Header response_headers = 2;
	optional bytes body = 3;
}

message OpenWSArgs {
	required string net_id = 1;
	required string url = 2;
	required string session_id = 3;
}

message WSOpeningReply {
	required int32 status = 1;
	optional int32 socket_id = 2;
}

message CallWSArg {
	required int32 socket_id = 1;
	required string cmd = 2;
	optional string msg = 3;
}

message CallWSReply {
	required string status = 1;
}

message WebSocketEvent {
	required int32 socket_id = 1;
	required string event = 2;
	optional string msg = 3;
	optional int32 code = 4;
	optional string reason = 5;
}
